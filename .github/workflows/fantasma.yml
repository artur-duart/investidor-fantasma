name: Investidor fantasma
on:
  schedule:
    - cron: "0 13-21 * * 1-5"
    - cron: "0 12 * * 0,6"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  atualizar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python simulador.py
      - run: |
          git config user.name "investidor-fantasma"
          git config user.email "actions@users.noreply.github.com"
          git add data
          git diff --cached --quiet || git commit -m "Atualiza carteira $(date -u +'%Y-%m-%d %H:%M')"
          git push
